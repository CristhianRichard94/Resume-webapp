<div class="container">
    <h1 class="title mat-headline-3 sm-center">{{ 'Sections.experience' | translate  | uppercase}}</h1>
    <div class="exp-container">

        <mat-accordion>
            <mat-expansion-panel *ngFor="let job of ('Experience.jobs' | translate)">
                <mat-expansion-panel-header>
                    <mat-panel-title>
                        {{ job.title }}
                    </mat-panel-title>
                </mat-expansion-panel-header>
                <mat-card-title>{{ job.company }}</mat-card-title>
                <p><i>{{ job.dates }}</i></p>
                <ul>
                    <li *ngFor="let bullet of job.bullets">{{ bullet }}</li>
                </ul>
            </mat-expansion-panel>
        </mat-accordion>
    </div>
</div>
